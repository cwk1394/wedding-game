<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>가위바위보 토큰 중복 검사</title>
</head>
<body>
  <h1>가위바위보 토큰 중복 검사</h1>
  <p>진행 중인 도전 토큰으로 바위 요청을 두 번 전송합니다.</p>
  <p>운영 DB가 갱신되며, 정상 종료 시 시험 기록 1건이 추가됩니다.</p>
  <p>비밀번호나 토큰을 직접 입력하지 않습니다.</p>
  <p>다른 게임 탭에서는 버튼을 누르지 마세요.</p>

  <button id="run" type="button">동일 토큰 요청 2개 검사</button>
  <pre id="result" aria-live="polite"
    style="white-space: pre-wrap;"></pre>

  <script>
    const button = document.getElementById('run');
    const output = document.getElementById('result');
    let started = false;

    async function callApi(body) {
      const response = await fetch('/api/rps', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        cache: 'no-store',
        body: JSON.stringify(body)
      });

      return {
        status: response.status,
        data: await response.json()
      };
    }

    function describe(item, index) {
      if (item.status !== 'fulfilled') {
        return '요청 ' + (index + 1) +
          ': 응답 확인 실패 — 실제 처리 여부 확인 필요';
      }

      const r = item.value;
      return '요청 ' + (index + 1) +
        ': HTTP ' + r.status +
        (['win', 'draw', 'lose'].includes(r.data?.result)
          ? ' / ' + r.data.result +
            ' / ' + r.data.streak + '연승'
          : '') +
        (r.status === 409 ? ' / 재사용 거절 응답' : '');
    }

    button.addEventListener('click', async () => {
      if (started) return;

      if (
        location.origin !==
        'https://wedding-game-ebon.vercel.app'
      ) {
        output.textContent = '중단: 운영 게임 주소가 아닙니다.';
        return;
      }

      let token;
      try {
        token = localStorage.getItem('rpsToken');
      } catch {
        output.textContent = '중단: 도전 토큰을 읽지 못했습니다.';
        return;
      }

      if (!token) {
        output.textContent =
          '진행 중인 토큰이 없습니다. 아직 검사를 실행하지 않았습니다.';
        return;
      }

      if (!confirm(
        '운영 DB에 실제 요청을 보냅니다. ' +
        '같은 토큰으로 바위 요청 2개를 보내고, ' +
        '차단 결과가 정상일 때 해당 도전을 종료할까요?'
      )) {
        return;
      }

      started = true;
      button.disabled = true;
      output.textContent =
        '검사 중… 새로고침하거나 다른 게임 탭을 조작하지 마세요.';

      let summary = '';

      try {
        const requests = await Promise.allSettled([
          callApi({ action: 'play', token, choice: 'rock' }),
          callApi({ action: 'play', token, choice: 'rock' })
        ]);

        summary = requests.map(describe).join('\n');
        output.textContent = summary;

        const accepted = requests.filter((item) =>
          item.status === 'fulfilled' &&
          item.value.status === 200 &&
          ['win', 'draw', 'lose'].includes(
            item.value.data?.result
          ) &&
          Number.isInteger(item.value.data?.streak) &&
          item.value.data.streak >= 0
        );

        const rejected = requests.filter((item) =>
          item.status === 'fulfilled' &&
          item.value.status === 409
        );

        if (accepted.length !== 1 || rejected.length !== 1) {
          throw new Error(
            '정상 처리 1개 + 재사용 거절 1개가 아닙니다. ' +
            '자동 종료·재시도를 하지 않았습니다.'
          );
        }

        const r = accepted[0].value.data;

        if (localStorage.getItem('rpsToken') !== token) {
          throw new Error(
            '다른 탭에서 토큰이 변경됐습니다. 자동 종료를 중단했습니다.'
          );
        }

        if (r.result === 'lose') {
          if (r.ended !== true) {
            throw new Error('패배 종료 응답을 확인하지 못했습니다.');
          }

          localStorage.removeItem('rpsToken');
          summary += '\n\n패배로 종료됐습니다.';
        } else {
          if (typeof r.token !== 'string' || !r.token) {
            throw new Error('다음 라운드 토큰을 확인하지 못했습니다.');
          }

          localStorage.setItem('rpsToken', r.token);

          const stopped = await callApi({
            action: 'stop',
            token: r.token
          });

          if (
            stopped.status !== 200 ||
            stopped.data?.ended !== true ||
            stopped.data.streak !== r.streak
          ) {
            throw new Error(
              '검사 요청의 차단 조합은 정상이지만, ' +
              '도전 종료 저장은 확인하지 못했습니다.'
            );
          }

          if (localStorage.getItem('rpsToken') !== r.token) {
            throw new Error(
              '종료 후 다른 탭의 토큰 변경이 확인됐습니다.'
            );
          }

          localStorage.removeItem('rpsToken');
          summary += '\n\n새 토큰으로 그만하기 저장까지 완료됐습니다.';
        }

        output.textContent =
          summary +
          '\n최종 시험 기록: ' + r.streak + '연승' +
          '\n\n응답 기준: 정상 처리 1개 / 재사용 거절 1개' +
          '\n다음 단계에서 DB 갱신 횟수와 기록 수를 확인하세요.' +
          '\n기존 게임 탭은 새로고침 전까지 조작하지 마세요.';
      } catch (error) {
        output.textContent =
          summary +
          '\n\n확인 필요: ' + error.message +
          '\n다시 실행하거나 게임 창을 열고 닫지 마세요.' +
          '\n응답이 끊겼다면 실제 저장 여부가 불확실할 수 있습니다.' +
          '\n결과 화면을 전달하고 DB 상태부터 확인하세요.';
      }
    });
  </script>
</body>
</html>
