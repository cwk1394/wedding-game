<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>관리자 DB 접속 확인</title>
</head>
<body>
  <h1>관리자 DB 접속 확인</h1>
  <p>DB 접속만 확인하며, 게임 기록을 변경하지 않습니다.</p>

  <form id="check-form">
    <label for="password">개발자 비밀번호</label>
    <input id="password" type="password" autocomplete="off" required />
    <button id="check-button" type="submit">접속 확인</button>
  </form>

  <pre id="result" aria-live="polite"></pre>

  <script>
    const form = document.getElementById('check-form');
    const passwordInput = document.getElementById('password');
    const button = document.getElementById('check-button');
    const result = document.getElementById('result');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (button.disabled) return;

      button.disabled = true;
      result.textContent = '확인 중…';

      try {
                const response = await fetch('/api/db-inspect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          cache: 'no-store',
          body: JSON.stringify({ password: passwordInput.value })
        });
        passwordInput.value = '';

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || '접속 확인에 실패했어요.');
        }
                      if (
        data.ok !== true ||
        data.readOnly !== true ||
        !Array.isArray(data.source) ||
        !Array.isArray(data.database)
      ) {
        throw new Error('예상한 기록 수 조회 결과가 아니에요.');
      }

      if (
        data.database.length !== 2 ||
        !['rps', 'chase'].every((game) =>
          data.database.some((item) =>
            item.game === game && item.fullMatch === true
          )
        )
      ) {
        throw new Error('두 게임의 전체 내용 일치를 확인하지 못했어요. 저장소 전환을 진행하지 마세요.');
      }

        const describe = (item) =>
          (item.game === 'rps' ? '가위바위보' : '도둑잡기') +
          '\n일반 기록: ' + item.records + '개' +
          '\n경품 보존 기록: ' + item.prizeRecords + '개' +
          '\n등록 연락처: ' + item.contacts + '개' +
          '\n사용한 토큰 정보: ' + item.burned + '개';

        result.textContent =
                  '복사 후 전체 비교 성공 (조회만 실행)\n가위바위보·도둑잡기 모두 Gist와 DB 전체 내용 일치\n\n' +
          '[기존 Gist]\n' +
          data.source.map(describe).join('\n\n') +
          '\n\n[새 DB]\n' +
          (data.database.length
            ? data.database.map(describe).join('\n\n')
            : '아직 복사된 게임 데이터가 없어요.') +
          '\n\n이번 조회에서는 기록을 복사하거나 변경하지 않았어요.';
      } catch (error) {
        result.textContent = '확인 실패: ' + error.message;
      } finally {
        passwordInput.value = '';
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
