name: Deploy guestbook

# 코드 push 또는 방명록(Discussion) 변경 시마다 guests.json을 새로 만들어 Pages에 배포
on:
  push:
    branches: [main]
    # 하객 이미지 커밋은 곧이어 오는 discussion 이벤트에서 함께 배포되므로 건너뜀
    paths-ignore: ['img/guests/**']
  discussion:
    types: [created, edited, deleted, category_changed]
  workflow_dispatch:

permissions:
  contents: read
  discussions: read
  pages: write
  id-token: write

# 동시에 여러 건이 들어오면 마지막 것만 배포 (어차피 전체를 다시 긁어옴)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build site
        run: |
          mkdir -p _site
          cp -r index.html css js img _site/
          # 보관용 원본 png(페이지는 webp만 씀)는 사이트에 올리지 않음
          rm -f _site/img/background/*.png _site/img/etc/*.png _site/img/npc/*/*.png
          if [ -d audio ]; then cp -r audio _site/; fi

      # 갤러리 사진 → 썸네일/보기용 webp (변환 결과는 캐시해서 새 사진만 변환)
      - uses: actions/cache@v4
        with:
          path: .cache/gallery
          key: gallery-${{ hashFiles('img/gallery/**') }}
          restore-keys: gallery-

      - name: Build gallery
        run: |
          npm install --no-save --no-package-lock sharp@0.33
          node scripts/build-gallery.mjs _site

      - name: Fetch guestbook from Discussions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GUESTBOOK_CATEGORY: 방명록
        run: node scripts/fetch-guests.mjs _site/data/guests.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
