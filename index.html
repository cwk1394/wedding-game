<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>우리 결혼합니다 - 방명록</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game"></div>

  <button id="write-btn" class="btn btn-primary write-btn">방명록 작성</button>

  <!-- 방명록 팝업 -->
  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-name">
      <div class="modal-header">
        <span class="modal-title">방명록</span>
        <button class="modal-close" data-close aria-label="닫기">×</button>
      </div>
      <div class="modal-body">
        <div class="modal-profile">
          <img id="modal-avatar" class="modal-avatar" alt="" />
          <div>
            <div id="modal-name" class="modal-name"></div>
            <div id="modal-short" class="modal-short"></div>
          </div>
        </div>
        <p id="modal-long" class="modal-long"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" data-close>확인</button>
      </div>
    </div>
  </div>

  <!-- 방명록 작성 폼 -->
  <div id="write-modal" class="modal" hidden>
    <form id="write-form" class="modal-card" role="dialog" aria-modal="true" aria-labelledby="write-title" novalidate>
      <div class="modal-header">
        <span id="write-title" class="modal-title">방명록 작성</span>
        <button type="button" class="modal-close" data-close aria-label="닫기">×</button>
      </div>
      <div class="modal-body form-body">
        <label class="field">
          <span>이름</span>
          <input name="name" maxlength="10" required autocomplete="name" />
        </label>
        <label class="field">
          <span>한줄 멘트 <small>(10자 이하, 말풍선으로 보여요)</small></span>
          <input name="shortMsg" maxlength="10" required />
        </label>
        <label class="field">
          <span>방명록</span>
          <textarea name="longMsg" maxlength="500" rows="4" required></textarea>
        </label>
        <label class="field">
          <span>캐릭터 정면 이미지 <small>(선택)</small></span>
          <input name="front" type="file" accept="image/png,image/jpeg,image/webp" />
        </label>
        <label class="field">
          <span>캐릭터 걷기 이미지 <small>(선택, 가로 4프레임)</small></span>
          <input name="walk" type="file" accept="image/png,image/jpeg,image/webp" />
        </label>
        <div class="preview" hidden>
          <img class="preview-front" alt="정면 미리보기" />
          <img class="preview-walk" alt="걷기 미리보기" />
        </div>
        <p class="form-error" role="alert" hidden></p>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-primary">등록하기</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/textures.js"></script>
  <script src="js/character.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
