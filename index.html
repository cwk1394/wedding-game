<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>경태 & 민지 결혼식 - 방명록</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game"></div>

  <button id="write-btn" class="btn btn-primary write-btn">방명록 작성</button>

  <!-- 방명록 팝업 -->
  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-name">
      <div class="modal-header">
        <span class="modal-title">방명록</span>
        <button class="modal-close" data-close aria-label="닫기">×</button>
      </div>
      <div class="modal-body">
        <div class="modal-profile">
          <img id="modal-avatar" class="modal-avatar" alt="" />
          <div>
            <div id="modal-name" class="modal-name"></div>
            <div id="modal-short" class="modal-short"></div>
          </div>
        </div>
        <p id="modal-long" class="modal-long"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" data-close>확인</button>
      </div>
    </div>
  </div>

  <!-- 방명록 작성 폼 -->
  <div id="write-modal" class="modal" hidden>
    <form id="write-form" class="modal-card" role="dialog" aria-modal="true" aria-labelledby="write-title" novalidate>
      <div class="modal-header">
        <span id="write-title" class="modal-title">방명록 작성</span>
        <button type="button" class="modal-close" data-close aria-label="닫기">×</button>
      </div>
      <ol class="steps" aria-label="작성 단계">
        <li class="active" data-step-dot="1"><b>1</b> 방명록 쓰기</li>
        <li data-step-dot="2"><b>2</b> 캐릭터 만들기</li>
      </ol>
      <div class="modal-body form-body">
        <!-- 1단계: 방명록 -->
        <div class="step" data-step="1">
          <label class="field">
            <span>이름 <small>(15자 이하)</small></span>
            <input name="name" maxlength="15" required autocomplete="name" />
          </label>
          <label class="field">
            <span>한줄 멘트 <small>(10자 이하, 말풍선으로 보여요)</small></span>
            <input name="shortMsg" maxlength="10" required />
          </label>
          <label class="field">
            <span>방명록</span>
            <textarea name="longMsg" maxlength="500" rows="5" required></textarea>
          </label>
        </div>

        <!-- 2단계: 캐릭터 -->
        <div class="step" data-step="2" hidden>
          <p class="step-intro">사진을 올리면 메이플 캐릭터로 바꿔드려요. <small>(선택)</small></p>
          <div class="char-maker">
            <label class="photo-pick">
              <input name="photo" type="file" accept="image/*" />
              <img class="photo-preview" alt="내 사진 미리보기" hidden />
              <span class="photo-empty"><b>＋</b>사진 선택</span>
            </label>
            <span class="char-arrow" aria-hidden="true">→</span>
            <div class="preview">
              <img class="preview-front" alt="캐릭터 미리보기" hidden />
              <img class="preview-walk" alt="걷기 미리보기" hidden />
              <span class="preview-empty">캐릭터</span>
            </div>
          </div>
          <button type="button" class="btn btn-secondary generate-btn">캐릭터 생성</button>
          <p class="gen-status" hidden><span class="spinner" aria-hidden="true"></span><span class="gen-text"></span></p>
          <small class="note">사진은 캐릭터를 만드는 데만 쓰이고 저장되지 않아요.<br/>생성에 1~3분 정도 걸려요.<br/>캐릭터 없이 등록해도 괜찮아요.</small>
        </div>
        <p class="form-error" role="alert" hidden></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost prev-btn" hidden>이전</button>
        <button type="button" class="btn btn-primary next-btn">다음</button>
        <button type="submit" class="btn btn-primary submit-btn" hidden>등록하기</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/textures.js"></script>
  <script src="js/character.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/view.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
