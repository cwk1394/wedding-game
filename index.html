<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>우리 결혼합니다 - 방명록</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game"></div>

  <button id="write-btn" class="btn btn-primary write-btn">방명록 작성</button>

  <!-- 방명록 팝업 -->
  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-name">
      <div class="modal-header">
        <span class="modal-title">방명록</span>
        <button class="modal-close" data-close aria-label="닫기">×</button>
      </div>
      <div class="modal-body">
        <div class="modal-profile">
          <img id="modal-avatar" class="modal-avatar" alt="" />
          <div>
            <div id="modal-name" class="modal-name"></div>
            <div id="modal-short" class="modal-short"></div>
          </div>
        </div>
        <p id="modal-long" class="modal-long"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" data-close>확인</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/textures.js"></script>
  <script src="js/character.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
